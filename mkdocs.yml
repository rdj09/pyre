site_name: pyRE - python package for non-life reinsurance pricing
site_url: https://rdj09.github.io/pyre/
theme:
  name: material
  logo: assets/brand/freyja-wordmark-offwhite.svg
  favicon: assets/brand/favicon.svg
  font: false
  palette:
    scheme: default
  highlightjs: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - social
extra_css:
  - stylesheets/freyja-docs.css
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.arithmatex
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - Claims: claims.md
  - Exposures: exposures.md
  - Models: models.md
  - Treaty: treaty.md
  - Rate Monitoring: rate_monitoring.md
  - Treaty Pricing Workbench: workbench.md
  - Excel File I/O: io_excel.md
  - About: about.md

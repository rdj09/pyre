[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyre"
dynamic = ["version"]
description = 'Python package for non-life reinsurance pricing exercises.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["reinsurance", "actuarial", "pricing", "insurance"]
authors = [
  { name = "Rhys Jones", email = "rhysjones437@googlemail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/rdj09/pyre#readme"
Issues = "https://github.com/rdj09/pyre/issues"
Source = "https://github.com/rdj09/pyre"

[project.optional-dependencies]
webapp = ["shiny>=1.0", "htmltools>=0.5", "pandas>=2.0"]
excel = ["openpyxl>=3.0"]
db-postgres = ["psycopg2-binary>=2.9"]
yaml = ["pyyaml>=6.0"]

[tool.hatch.version]
path = "src/pyre/__about__.py"

# ---------------------------------------------------------------------------
# uv dependency groups (PEP 735)
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "pymdown-extensions>=10.0",
]
webapp = [
  "shiny>=1.0",
  "htmltools>=0.5",
  "pandas>=2.0",
]
excel = [
  "openpyxl>=3.0",
]
db-postgres = [
  "psycopg2-binary>=2.9",
]
yaml = [
  "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Hatch environments (kept for backward compatibility)
# ---------------------------------------------------------------------------

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy>=1.10.0",
  "pre-commit",
]

[tool.hatch.envs.default.scripts]
test = "pytest --cov=pyre --cov-report=term-missing --cov-fail-under=80 {args}"
test-no-cov = "pytest {args}"
lint = "ruff check src/pyre tests"
fmt = "ruff format src/pyre tests"
fmt-check = "ruff format --check src/pyre tests"
typecheck = "mypy src/pyre"
check-all = ["lint", "fmt-check", "typecheck", "test"]

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "pymdown-extensions",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean --strict"
deploy = "mkdocs gh-deploy --force --clean --remote-branch gh-pages"
serve = "mkdocs serve --dev-addr localhost:8000"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.10"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "pyre.models.exposure.exposure_ILF_fitting",
    "pyre.models.exposure.exposure_curve_fitting",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*", "scipy.*", "yaml.*", "openpyxl.*", "psycopg2.*"]
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["pyre", "tests"]
branch = true
parallel = true
omit = [
  "src/pyre/__about__.py",
]

[tool.coverage.paths]
pyre = ["src/pyre", "*/pyre/src/pyre"]
tests = ["tests", "*/pyre/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyre"
dynamic = ["version"]
description = 'Python package for non-life reinsurance pricing exercises.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Rhys Jones", email = "rhysjones437@googlemail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.optional-dependencies]
panel = [
  "panel>=1.4",
  "pandas>=2.0",
]
excel = [
  "openpyxl>=3.1",
]


[project.urls]
Documentation = "https://github.com/rdj09/pyre#readme"
Issues = "https://github.com/rdj09/pyre/issues"
Source = "https://github.com/rdj09/pyre"

[tool.hatch.version]
path = "src/pyre/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.default]
dependencies = [
  "pytest-cov",
  "openpyxl>=3.1",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pyre tests}"

[tool.coverage.run]
source_pkgs = ["pyre", "tests"]
branch = true
parallel = true
omit = [
  "src/pyre/__about__.py",
]

[tool.coverage.paths]
pyre = ["src/pyre", "*/pyre/src/pyre"]
tests = ["tests", "*/pyre/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["pyre"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--tb=short"
pythonpath = ["src", "."]

[tool.hatch.envs.panel]
dependencies = [
  "panel>=1.4",
  "pandas>=2.0",
]
[tool.hatch.envs.panel.scripts]
serve = "panel serve app/main.py --show --autoreload"

[tool.hatch.envs.excel]
dependencies = [
  "openpyxl>=3.1",
]

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs",
  "mkdocstrings[python]",
  "mkdocs-material[imaging]",
  "mkdocs-material",
  "markdown",
  "pymdown-extensions"
]
[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean --strict"
deploy = "mkdocs gh-deploy --force --clean --remote-branch gh-pages"
serve = "mkdocs serve --dev-addr localhost:8000"